services:
  gateway:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      ENABLE_DOCS: "false"
      MAX_REQUEST_BYTES: "200000"
      MAX_PROMPT_CHARS: "24000"
      MAX_MESSAGES: "100"
      MAX_OUTPUT_TOKENS: "1024"
  grafana:
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD and pass --env-file .env}
    ports: !override
      - "127.0.0.1:3000:3000"
  postgres:
    restart: unless-stopped
    ports: !reset []
  redis:
    restart: unless-stopped
    ports: !reset []
  prometheus:
    restart: unless-stopped
    ports: !reset []
  otel-collector:
    restart: unless-stopped
    ports: !reset []
  tempo:
    restart: unless-stopped
    ports: !reset []
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/conduit.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
