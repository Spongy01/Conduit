services:
  gateway:
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      ENABLE_DOCS: "false"
      MAX_REQUEST_BYTES: "200000"
      MAX_PROMPT_CHARS: "24000"
      MAX_MESSAGES: "100"
  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD and pass --env-file .env}
    ports: !override
      - "127.0.0.1:3000:3000"
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  prometheus:
    ports: !reset []
  otel-collector:
    ports: !reset []
  tempo:
    ports: !reset []