# Public front door for Conduit. Tailscale Funnel forwards here; only the two
# client-facing API routes are passed to the gateway, everything else is 404.
# (Admin UI/API, /metrics, /docs, /openapi.json must never be reachable here.)

# Coarse outer limit on total request rate. Per-client-IP limiting is not
# possible: behind Docker's port publishing and Funnel the source address is
# not the real caller. Per-team limits are enforced by the gateway itself.
limit_req_zone "global" zone=conduit_global:1m rate=20r/s;

server {
    listen 8080;
    server_tokens off;

    # Matches the prod MAX_REQUEST_BYTES (200000); the gateway enforces it too.
    client_max_body_size 200k;

    limit_req zone=conduit_global burst=40 nodelay;
    limit_req_status 429;

    location = /api/v1/chat/completion {
        limit_except POST { deny all; }
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Tokens must reach the client as they are produced.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /api/v1/models {
        limit_except GET { deny all; }
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
